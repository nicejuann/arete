name: Refresh educational headlines
on:
  schedule:
    - cron: '23 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh_headlines.py'
      - '.github/workflows/refresh-headlines.yml'
permissions:
  contents: write
concurrency:
  group: arete-content-publish
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Collect publisher titles and links
        run: python3 scripts/refresh_headlines.py
      - name: Publish changed digest only
        run: |
          if git diff --quiet -- fresh.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fresh.json
          git commit -m "Refresh ARETE publisher headlines"
          git pull --rebase
          git push
