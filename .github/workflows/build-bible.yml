name: Build complete offline Bible
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_bible.py'
      - '.github/workflows/build-bible.yml'
permissions:
  contents: write
concurrency:
  group: arete-content-publish
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build_bible.py
      - name: Publish validated pack
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bible-webp.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish validated offline WEB Protestant Bible"
          git pull --rebase
          git push
