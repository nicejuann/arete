name: Refresh CC0 museum gallery
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh_gallery.py'
      - '.github/workflows/refresh-gallery.yml'
permissions:
  contents: write
concurrency:
  group: arete-content-publish
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate gallery processing
        run: python3 scripts/refresh_gallery.py --test
      - name: Collect public-domain artwork
        run: python3 scripts/refresh_gallery.py
      - name: Publish collection
        run: |
          if git diff --quiet -- gallery.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gallery.json
          git commit -m "Refresh ARETE CC0 museum gallery"
          git pull --rebase
          git push
