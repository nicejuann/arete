name: Release quality checks
on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'content.js'
      - 'sw.js'
      - 'scripts/test_release.cjs'
      - 'scripts/audit_links.py'
      - '.github/workflows/quality.yml'
  workflow_dispatch:
  schedule:
    - cron: '31 2 * * 1'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/test_release.cjs
  link-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/audit_links.py
      - uses: actions/upload-artifact@v4
        with:
          name: link-audit
          path: link-audit.json
          retention-days: 7
