name: Release quality checks
on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'content.js'
      - 'sw.js'
      - 'scripts/test_release.cjs'
      - 'scripts/test_browser.cjs'
      - 'scripts/audit_links.py'
      - 'scripts/source_inventory.cjs'
      - '.github/workflows/quality.yml'
  workflow_dispatch:
  schedule:
    - cron: '31 2 * * 1'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/test_release.cjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Mobile browser and offline smoke test
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/arete-server.log 2>&1 &
          for i in $(seq 1 15); do curl -fs http://127.0.0.1:8765/ >/dev/null && break; sleep 1; done
          node scripts/test_browser.cjs
  link-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/source_inventory.cjs
      - run: python3 scripts/audit_links.py
      - uses: actions/upload-artifact@v4
        with:
          name: link-audit
          path: |
            link-audit.json
            source-inventory.json
            editorial-review.csv
          retention-days: 7
